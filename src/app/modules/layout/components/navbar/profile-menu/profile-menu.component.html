
<div class="relative ml-3">
  <!-- Profile Button -->
  <button (click)="toggleMenu()" class="relative flex rounded-full bg-card text-sm" type="button">
    <span class="sr-only">Ouvrir le menu utilisateur</span>      
      <svg-icon appClickOutside
      (clickOutside)="isOpen = false"
      class="rounded-md text-foreground" src="/assets/icons/heroicons/outline/client.svg" alt=""></svg-icon>
  </button>
  <!-- Dropdown -->
  <div
    [@openClose]="isOpen ? 'open' : 'closed'"
    class="absolute right-0 z-20 mt-2 w-60 origin-top-right transform rounded-md bg-background py-4 shadow-custom ring-1 ring-transparent transition focus:outline-hidden">
    <div class="flext-row flex items-center px-4 pb-4">
      <div class="w-10 shrink-0">
        <svg-icon class="rounded-md text-foreground" src="/assets/icons/heroicons/outline/client.svg" alt=""></svg-icon>
      </div>
      <div class="ml-3 overflow-hidden">
        <div *ngIf="userService.getConnectedUser() as user" class="text-sm font-semibold text-foreground">
          <ng-container *ngIf="user.prenom || user.nom; else anonyme">
            {{ user.prenom | titlecase }} {{ user.nom | uppercase }}
          </ng-container>
          <ng-template #anonyme>Utilisateur</ng-template>
        </div>
        <p class="truncate text-ellipsis text-xs font-medium text-muted-foreground">
          {{ userService.getConnectedUser().email || 'Email non disponible' }}
        </p>
      </div>
    </div>

    <div class="border-b border-dashed border-border"></div>

    <ul class="my-2 mx-4 flex flex-col">
      <li *ngFor="let item of profileMenu"
          (click)="handleMenuAction(item.action, item.link)"
          class="inline-flex cursor-pointer items-center gap-2 rounded-md px-3 py-2 text-xs font-semibold text-muted-foreground hover:bg-card hover:text-primary">
        <svg-icon src="{{ item.icon }}" [svgClass]="'h-5 w-5 text-muted-foreground/50'"> </svg-icon>
        {{ item.title }}
      </li>

    </ul>
    <hr class="border-dashed border-border" />
    <div class="mx-4 my-2">
      <span class="text-xs font-semibold text-foreground">Couleur</span>
      <div class="mt-2 grid grid-cols-2 gap-2">
        <div *ngFor="let item of themeColors"
             (click)="toggleThemeColor(item.name)"
             [ngClass]="{ 'border-muted-foreground bg-card': item.name == themeService.theme().color }"
             class="focus-visible:ring-ring inline-flex h-8 cursor-pointer items-center justify-start whitespace-nowrap rounded-md border border-border bg-background px-3 text-xs font-medium text-muted-foreground shadow-xs transition-colors focus-visible:outline-hidden focus-visible:ring-1 disabled:pointer-events-none disabled:opacity-50 hover:bg-card hover:text-foreground">
          <span
            [style.backgroundColor]="item.code"
            class="mr-1 flex h-5 w-5 shrink-0 -translate-x-1 items-center justify-center rounded-full bg-rose-500"></span>
          <p>{{ item.label }}</p>
        </div>

      </div>
    </div>
    <div class="mx-4 my-2">
      <span class="text-xs font-semibold text-foreground">Apparence</span>
      <div class="mt-2 grid grid-cols-2 gap-2">
        <div *ngFor="let item of themeMode"
             (click)="setThemeMode(item.value)"
             [ngClass]="{ 'border-muted-foreground bg-card': item.value == themeService.theme().mode }"
             class="focus-visible:ring-ring inline-flex h-8 cursor-pointer items-center justify-start whitespace-nowrap rounded-md border border-border bg-background px-3 text-xs font-medium text-muted-foreground shadow-xs transition-colors focus-visible:outline-hidden focus-visible:ring-1 disabled:pointer-events-none disabled:opacity-50 hover:bg-card hover:text-foreground">
          <svg-icon
            [src]="
              item.value == 'light' ? 'assets/icons/heroicons/outline/sun.svg' : 'assets/icons/heroicons/outline/moon.svg'
            "
            [svgClass]="'h-5 mr-2 w-5 text-muted-foreground/50'">
          </svg-icon>
          <p>{{ item.label }}</p>
        </div>

      </div>
    </div>
  </div>
</div>
