<app-notifications></app-notifications>

<form  [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="my-10 space-y-6">
  <div class="text-center">
    <h2 class="mb-1 text-3xl font-semibold text-foreground">
      Mot de passe oublié <span class="text-primary">?</span>
    </h2>
    <p class="text-sm text-muted-foreground">Saisissez votre email pour recevoir un lien de réinitialisation.</p>
  </div>

  <div *ngIf="message" class="p-3 bg-green-100 border border-green-400 text-green-700 rounded-sm">
    {{ message }}
  </div>
  
  <div *ngIf="error" class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-sm">
    {{ error }}
  </div>

  <div class="space-y-3 text-left">
    <div class="relative">
      <input 
        type="email" 
        id="email" 
        formControlName="email"
        class="peer block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-hidden focus:ring-2 focus:ring-primary focus:border-transparent"
        placeholder=" "
        [class.border-red-500]="email?.invalid && email?.touched"
      />
      <label
        for="email"
        class="absolute top-2 left-1 z-10 origin-left -translate-y-4 scale-95 transform bg-background px-2 text-sm text-muted-foreground duration-300 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:scale-100 peer-focus:top-2 peer-focus:-translate-y-4 peer-focus:scale-95 peer-focus:px-2 peer-focus:text-primary">
        Email
      </label>
      
      <div *ngIf="email?.invalid && email?.touched" class="mt-1">
        <small *ngIf="email?.errors?.['required']" class="text-red-500">
          L'email est requis
        </small>
        <small *ngIf="email?.errors?.['email']" class="text-red-500">
          Veuillez entrer un email valide
        </small>
      </div>
    </div>
  </div>

  <div class="flex justify-between space-x-2">
    <div class="w-full">
      <button 
        type="submit"
        [disabled]="isLoading || forgotPasswordForm.invalid"
        class="w-full px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center">
        <span *ngIf="isLoading" class="mr-2">
          <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </span>
        {{ isLoading ? 'Envoi...' : 'Envoyer le lien' }}
      </button>
    </div>
    <div class="w-full">
      <button 
        type="button"
        (click)="onCancel()"
        class="w-full px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300">
        Annuler
      </button>
    </div>
  </div>
</form>
